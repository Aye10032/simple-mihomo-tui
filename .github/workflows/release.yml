name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-baseline
            asset: mihomo-tui-linux-x64
          - target: bun-linux-arm64
            asset: mihomo-tui-linux-arm64
          - target: bun-darwin-x64-baseline
            asset: mihomo-tui-darwin-x64
          - target: bun-darwin-arm64
            asset: mihomo-tui-darwin-arm64
          - target: bun-windows-x64-baseline
            asset: mihomo-tui-windows-x64.exe
          - target: bun-windows-arm64
            asset: mihomo-tui-windows-arm64.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install all platform packages
        run: bun install --frozen-lockfile --os="*" --cpu="*"
      - run: bun run build ${{ matrix.target }} dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum mihomo-tui-* > checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
